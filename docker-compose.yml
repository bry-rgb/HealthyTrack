services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: healthytrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: healthytrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: