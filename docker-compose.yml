services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: healthytrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: healthytrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthytrack -d healthytrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_USER: healthytrack
      DB_NAME: healthytrack
      PGHOST: db
      PGPORT: 5432
      PGUSER: healthytrack
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: healthytrack
    command: ["sh", "-c", "unset PGM_DATABASE_URL; npm run migrate:up && npm run seed && node server.js"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  postgres_data:
