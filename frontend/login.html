
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthyTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🐸 HealthyTrack</h1>
    <p>Cuida de ti, um hábito de cada vez.</p>

    <div class="card">
        <h2>Iniciar sessão</h2>

        <label for="emailLogin">Email</label>
        <input id="emailLogin" type="email" placeholder="O teu email">

        <label for="senhaLogin">Senha</label>
        <input id="senhaLogin" type="password" placeholder="A tua senha">

        <button id="botaoLogin">Entrar</button>

        <hr>

        <h2>Criar conta</h2>

        <label for="nomeRegisto">Nome</label>
        <input id="nomeRegisto" type="text" placeholder="O teu nome">

        <label for="emailRegisto">Email</label>
        <input id="emailRegisto" type="email" placeholder="O teu email">

        <label for="senhaRegisto">Senha</label>
        <input id="senhaRegisto" type="password" placeholder="Cria uma senha">

        <button id="botaoRegisto">Criar conta</button>

        <p id="mensagemAutenticacao"></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
