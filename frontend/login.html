<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthyTrack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <header class="login-header">
        <h1>🌱 HealthyTrack</h1>
        <p>Pequenos hábitos, grandes aventuras.</p>
    </header>

    <main class="login-layout">

        <div class="mascotes-login">
            <img
                src="assets/mascotes/Winking Frog Adventurer with Water Bottle.png"
                alt="Sapo aventureiro com mapa"
                class="mascote mascote-aventureiro"
            >
        </div>

        <div class="card">

            <div class="login-tabs">
                <button
                    type="button"
                    id="tabEntrar"
                    class="tab-ativa"
                >
                    Entrar
                </button>

                <button
                    type="button"
                    id="tabCriarConta"
                >
                    Criar conta
                </button>
            </div>

            <div id="painelLogin" class="painel-autenticacao">

                <h2>Bem-vindo de volta!</h2>
                <p>Continua a tua aventura.</p>

             <form id="formLogin">   
                <label for="emailLogin">Email</label>
                <input
                    id="emailLogin"
                    type="email"
                    placeholder="O teu email"
                >

                <label for="senhaLogin">Senha</label>
                <input
                    id="senhaLogin"
                    type="password"
                    placeholder="A tua senha"
                >

                <button id="botaoLogin" type="submit">Entrar</button>
            </form>
            </div>

            <div
                id="painelRegisto"
                class="painel-autenticacao"
                hidden
            >

                <h2>Nova aventura!</h2>
                <p>Cria a tua conta HealthyTrack.</p>

                <label for="nomeRegisto">Nome</label>
                <input
                    id="nomeRegisto"
                    type="text"
                    placeholder="O teu nome"
                >

                <label for="emailRegisto">Email</label>
                <input
                    id="emailRegisto"
                    type="email"
                    placeholder="O teu email"
                >

                <label for="senhaRegisto">Senha</label>
                <input
                    id="senhaRegisto"
                    type="password"
                    placeholder="Cria uma senha"
                >

                <button id="botaoRegisto">Criar conta</button>

            </div>

            <p id="mensagemAutenticacao"></p>

        </div>

    </main>

    <script src="login.js"></script>

</body>
</html>
