<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação inicial | HealthyTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-avaliacao">
    <h1>🌱 HealthyTrack</h1>

    <main class="avaliacao-layout">
        <div class="mascote-avaliacao">
            <img
                src=assets/mascotes/StandingMascot.png
                alt="Mascote HealthyTrack em pé, a preencher um formulário"
            >
        </div>

        <section class="card">
            <h2>Avaliação inicial</h2>
            <p>Vamos conhecer um pouco melhor os teus hábitos para personalizar a tua meta de hidratação.</p>

            <form id="formAvaliacao">
                <label for="faixaEtaria">Faixa etária</label>
                <select id="faixaEtaria" name="faixaEtaria" required>
                    <option value="">Seleciona uma opção</option>
                    <option value="13-17">13 a 17 anos</option>
                    <option value="18-64">18 a 64 anos</option>
                    <option value="65+">65 anos ou mais</option>
                </select>

                <label for="peso">Peso aproximado (kg) — opcional</label>
                <input id="peso" name="peso" type="number" min="1" step="0.1">

                <label for="atividade">Nível de atividade habitual</label>
                <select id="atividade" name="atividade" required>
                    <option value="">Seleciona uma opção</option>
                    <option value="baixa">Baixo</option>
                    <option value="moderada">Moderado</option>
                    <option value="alta">Elevado</option>
                </select>

                <label for="exercicioCalor">Com que frequência fazes exercício intenso ou estás exposto a calor?</label>
                <select id="exercicioCalor" name="exercicioCalor" required>
                    <option value="">Seleciona uma opção</option>
                    <option value="raramente">Raramente</option>
                    <option value="algumas-vezes">Algumas vezes por semana</option>
                    <option value="frequentemente">Frequentemente</option>
                </select>

                <fieldset>
                    <legend>Tens alguma condição ou indicação médica que limite a ingestão de líquidos?</legend>

                    <label>
                        <input type="radio" name="limiteLiquidos" value="nao" required>
                        Não
                    </label>

                    <label>
                        <input type="radio" name="limiteLiquidos" value="sim">
                        Sim
                    </label>

                    <label>
                        <input type="radio" name="limiteLiquidos" value="nao-sei">
                        Não sei
                    </label>
                </fieldset>

                <label for="unidade">Unidade preferida</label>
                <select id="unidade" name="unidade" required>
                    <option value="L">Litros (L)</option>
                    <option value="mL">Mililitros (mL)</option>
                </select>

                <button type="submit">Continuar</button>
            </form>
        </section>
    </main>

    <script src="avaliacao-inicial.js"></script>
</body>
</html>
