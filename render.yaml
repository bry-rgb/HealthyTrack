services:
  - type: web
    name: waterkraft-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c 'npm run migrate:up && npm run seed && node server.js'
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: waterkraft-db
          property: connectionString
      - key: PGM_DATABASE_URL
        fromDatabase:
          name: waterkraft-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        value: https://waterkraft-frontend.onrender.com

  - type: web
    name: waterkraft-frontend
    runtime: static
    rootDir: frontend
    buildCommand: node render-build.js
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        fromService:
          name: waterkraft-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: waterkraft-db
    databaseName: waterkraft
    user: waterkraft_app
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
